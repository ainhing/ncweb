<h2>Danh sách sách</h2>
<p>{{errMessage}}</p>

<a routerLink="/book-new">
  <button>Create New</button>
</a>

<table border="1">
  <tr>
    <th>BookId</th>
    <th>BookName</th>
    <th>Author</th>
    <th>Category</th>
    <th>Price</th>
    <th>Image</th>
    <th>Action</th>
  </tr>
  <tbody>
    <tr *ngFor="let book of books">
      <td>{{book.BookId}}</td>
      <td>{{book.BookName}}</td>
      <td>{{book.Author}}</td>
      <td>{{book.Category}}</td>
      <td>{{book.Price}}</td>
      <td>
        <img *ngIf="book.Image" src="http://localhost:3000/image/{{book.Image}}" width="50px" height="50px">
      </td>
      <td>
        <a [routerLink]="['/book-detail', book.BookId]">
          <button>Details</button>
        </a>
        <a [routerLink]="['/book-edit', book.BookId]">
          <button>Edit</button>
        </a>
        <button (click)="deleteBook(book.BookId)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
