<h2>Chi tiết sách</h2>
<p>{{errMessage}}</p>

<table border="1">
  <tr>
    <td>Book Id:</td>
    <td>{{book.BookId}}</td>
  </tr>
  <tr>
    <td>Book Name:</td>
    <td>{{book.BookName}}</td>
  </tr>
  <tr>
    <td>Author:</td>
    <td>{{book.Author}}</td>
  </tr>
  <tr>
    <td>Category:</td>
    <td>{{book.Category}}</td>
  </tr>
  <tr>
    <td>Price:</td>
    <td>{{book.Price}}</td>
  </tr>
  <tr>
    <td>Image:</td>
    <td>
      <img *ngIf="book.Image" src="http://localhost:3000/image/{{book.Image}}" width="100px">
    </td>
  </tr>
</table>

<br>
<button (click)="goBack()">Back to List</button>
