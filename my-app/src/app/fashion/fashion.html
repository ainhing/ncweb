<p>fashion works!</p>
{{ errMessage }}

<div class="mb-3">
  <button class="btn btn-success" (click)="addNew()">+ Thêm mới</button>
</div>

<table border="1" class="table table-bordered table-hover align-middle">
  <tr>
    <td>Id</td>
    <td>Fashion Subject</td>
    <td>Fashion Detail</td>
    <td>Image</td>
    <td>Thao tác</td>
  </tr>
  <tbody>
    <tr *ngFor="let fashion of fashions">
      <td>{{ fashion._id }}</td>
      <td>{{ fashion.fashion_subject }}</td>
      <td>{{ fashion.fashion_detail }}</td>
      <td>
        <img
          src="{{ get_image(fashion.fashion_image) }}"
          width="100px"
          height="100px"
          (click)="viewDetail(fashion._id)"
          style="cursor: pointer;"
        />
      </td>
      <td>
        <button class="btn btn-primary btn-sm me-1" (click)="edit(fashion._id)">Sửa</button>
        <button class="btn btn-danger btn-sm" (click)="delete(fashion._id)">Xóa</button>
      </td>
    </tr>
  </tbody>
</table>
