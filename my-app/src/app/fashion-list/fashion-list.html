<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Danh sách Fashion</h2>
    <button class="btn btn-success" (click)="addNew()">+ Thêm mới</button>
  </div>

  @if (errMessage) {
    <div class="alert alert-danger">{{ errMessage }}</div>
  }

  <table class="table table-bordered table-hover align-middle">
    <thead class="table-dark">
      <tr>
        <th>Thumbnail</th>
        <th>Style</th>
        <th>Tiêu đề</th>
        <th>Ngày tạo</th>
        <th>Thao tác</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let f of fashions">
        <td>
          <img *ngIf="f.fashion_image"
               [src]="get_image(f.fashion_image)"
               width="80" height="80" style="object-fit:cover">
        </td>
        <td>{{ f.style }}</td>
        <td>{{ f.fashion_subject }}</td>
        <td>{{ f.createdAt | date:'dd/MM/yyyy' }}</td>
        <td>
          <button class="btn btn-info btn-sm me-1" (click)="viewDetail(f._id)">Xem</button>
          <button class="btn btn-primary btn-sm me-1" (click)="edit(f._id)">Sửa</button>
          <button class="btn btn-danger btn-sm" (click)="delete(f)">Xóa</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
