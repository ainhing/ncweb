<div class="container mt-4">
  <div class="card" style="width: 18rem;">
    <div class="card-header">Login System</div>
    <div class="card-body">
      <form [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="mb-3">
          <label class="form-label">User Name:</label>
          <input type="text" class="form-control" formControlName="user" />
          @if (loginForm.get('user')?.invalid && loginForm.get('user')?.touched) {
            <div class="text-danger small">Vui lòng nhập tên đăng nhập</div>
          }
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" formControlName="password" />
          @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
            <div class="text-danger small">Vui lòng nhập mật khẩu</div>
          }
        </div>
        <button type="submit" class="btn btn-primary" [disabled]="loginForm.invalid">
          Login
        </button>
        <button type="button" class="btn btn-secondary ms-2" (click)="logout()">
          Logout
        </button>
      </form>
      @if (message) {
        <p class="mt-3 text-info">{{ message }}</p>
      }
    </div>
  </div>
</div>
