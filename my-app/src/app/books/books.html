<p>books works!</p>
<p style="color:red">{{errMessage}}</p>

<button (click)="go_create()">Create New</button>

<table border="1">
  <tr>
    <td>BookId</td>
    <td>BookName</td>
    <td>Price</td>
    <td>Image</td>
    <td>Action</td>
  </tr>

  <tbody>
    <tr *ngFor="let book of books">
      <td>{{book.BookId}}</td>
      <td>{{book.BookName}}</td>
      <td>{{book.Price}}</td>

      <td>
        <button (click)="view_detail(book.BookId)" style="border:none;background:transparent;cursor:pointer">
          <img src="http://localhost:3000/static/images/{{book.Image}}" width="100" height="100" />
        </button>
      </td>

      <td>
        <button (click)="view_detail(book.BookId)">Details</button>
        |
        <button (click)="delete_book(book.BookId)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>
